
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
      body{
        text-align:center;
        padding-top:100px;
        display:flex;
        justify-content: center;
        text-align: center;
        width:100%;

      }
      #tim{
        font-size: 40px;
        margin:20px;
      }
      .modechange{
        background-color: black;
        color:#ffffff
      }
      button{
        background-color: green;
        color:white;
        border-radius: 5px;
        padding:5px;
        margin:5px;
      }
    </style>
</head>
<body><div class="container">
    <div id="tim"></div>
    <button type="button" onClick="myFunction()">Light/Dark</button>
    </div>
    <script>
       function Time(){
        let time=new Date();
        let hours=time.getHours();
        let minutes=time.getMinutes();
        let seconds=time.getSeconds();

       hours=String(hours).padStart(2,'0');
       minutes=String(minutes).padStart(2,'0');
       seconds=String(seconds).padStart(2,'0');
       document.getElementById("tim").textContent= hours + ":" + minutes + ":" + seconds;
       
       }
       setInterval(Time,1000);
       Time();
      
       function myFunction(){
           document.body.classList.toggle('modechange');
       }
    </script>
</body>
</html>
