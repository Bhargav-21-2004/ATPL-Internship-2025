<!DOCTYPE html>
<html>
<head>
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
       display:flex;
      text-align: center;
      justify-content:center;
      height:100vh;
      background-color: rgb(4, 1, 15);
      color:white;
    }
    input {
      padding: 10px;
      width: 200px;
      border-radius: 5px;
    }
    button {
      padding: 10px;
      border-radius: 5px;
      background-color: rgb(1, 18, 21);
      color: burlywood;
    }
    #result {
      margin-top: 20px;
    }
    .container{
      display:flex;
      text-align: center;
      justify-content:center;
      flex-direction: column;
      width:fit-content;
      padding:10px;
      margin:10px;
    
      height:100vh;

    }
    .incontainer{
      background-color: rgb(20, 116, 20);
      padding:20px;
      margin-bottom:20px;
      border-radius:10px;

    }
  </style>
</head>
<body>
<div class="container">
  <div class="incontainer">
  <h2>Weather App</h2>

  <input id="cityInput" type="text" placeholder="Enter city name"><br><br>
  <button onclick="getWeather()">Check Weather</button>

  <div id="result"></div>
  </div>
</div>
  <script>
    async function getWeather() {
      const city = document.getElementById("cityInput").value;

      if (city === "") {
        alert("Please enter a city name");
      }

      const apiKey = "df6205d90669f336df6f2ea02809c727";
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.cod === 200) {
          const temp = data.main.temp;
          const humidity = data.main.humidity;
          const weather = data.weather[0].main;

          document.getElementById("result").innerHTML = `
            <h3>Weather in ${city}</h3>
            <p> Temperature: ${temp} °C</p>
            <p> Humidity: ${humidity}%</p>
            <p> Condition: ${weather}</p>
          `;
        } else {
          document.getElementById("result").innerHTML = "City not found!";
        }
      } catch (error) {
        document.getElementById("result").innerHTML = "Error getting weather.";
      }
    }
  </script>

</body>
</html>
