<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <style>
        .pricing-box{
            display:inline-block;
            width:28%;
            margin:1%;
            background-color: rgb(197, 181, 181);
            border:2px solid rgb(18, 10, 10);
            border-radius:10px;
            padding:20px;
            box-sizing: border-box;
            text-align:center;
        }
        
  
        .features{
            padding:0px;
            margin:0px;
        }
        .features li{
            list-style-type:none;
            padding:5px;
        
        }
        .pr{
            text-align:center;
        }
        .head{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pricing-box">
            <h2 class="head">Basic</h2>
            <p class="pr">$299/month</p>
            <ul class="features">
                <li>Feature 1</li>
                <li>Feature 2</li>
            </ul>
        </div>

        <div class="pricing-box">
            <h2 class="head">Standard</h2>
            <p class="pr">$599/month</p>
            <ul class="features">
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            </ul>
        </div>

       <div class="pricing-box">
            <h2 class="head">Premium</h2>
            <p class="pr">$999/month</p>
            <ul class="features">
                <li>All Features</li>
            </ul>
        </div>
    </div>
</body>
</html>
