<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwoColoumn</title>
    <style>
        .container{
           display:flex;
        }
        .left{
            width:50%;
            background-color:rgb(243, 232, 232);
            padding:20px;
            border:1px solid rgb(222, 211, 211);
            float: left;

        }
        .right{
             width:70%;
             background-color:rgb(187, 208, 187);
             padding:20px;
             border:1px solid rgb(240, 185, 185);
             
        }
    </style>
</head>
<body>
    <h2>Two Coloumn Layout</h2>
    <div class="container">
       <div class="left">
        <h2>Left Column</h2>
        <p>This is the side bar Content</p>
       </div>
       <div class="right">
        <h2>Main Content</h2>
        <p>This is the main article content</p>
        
       </div>
    </div>
</body>
</html>
