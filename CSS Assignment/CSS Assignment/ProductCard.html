<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        button{
            background-color: chocolate;
            color: white;
            border-radius: 3px;
            border: none;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            border: 1px solid black;
            border-radius: 10px;
            padding:5px 50px 5px 50px;
            margin: 30px;
            max-width: 250px;
            text-align: center;
        }
        button:hover{
            background-color: blue;
            transform: scale(1.05);
            
        }


    </style>
</head>
<body>

    <div class="container">
    <div class="card">
    <img src="https://cdn.shopify.com/s/files/1/0397/2638/3257/files/Chocolate-Rolex-Watch_480x480.jpg?v=1664192175" alt="watch image" style="width:100px;">
    <h2>Rolex Watch</h2>

    <p> $19.99</p>
    <button type="submit" value="Buy Now">Buy Now</button>
    </div>
    </div>
</body>
</html>
