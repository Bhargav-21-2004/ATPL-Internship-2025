<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Student Registration Form</h1>
    <h4> Fill in this form to register</h4>
    <form action="submit">
    <label for="name">First Name</label>
    <input type="text" id="name" placeholder="Enter Your first name" required><br><br>
    <label for="lastname">Last Name</label>
    <input type="text" id="lastname" placeholder="Enter your last name" required><br><br>
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="Enter your e-mail" required><br><br>
    <label for="date">Date Of Birth</label>
    <input type="date" id="date" required><br><br>
    <label for="user">Set Username</label>
    <input type="text" id="user" placeholder="Set Username" required><br><br>
    <label for="pass"> Set Password</label>
    <input type="password" id="pass" placeholder="Set password" required><br><br>
    
     <label for="age"> Age:</label>
    <input type="number" id="age" placeholder="Enter your age"  min="18" max="100"><br><br>

    <label for="gender">Gender</label><br>
    <input type="radio" id="male" value="Male" name="gender">
    <label for="male"> Male</label><br>
    
    <input type="radio" id="gender" value="Female" name="gender">
     <label for="male"> Female</label><br>
     
    <input type="radio" id="gender" value="Others" name="gender">
    <label for="male"> Others</label><br><br>
    <label type="course">Course:</label>
    <select id="course" name="crs" required><br>
        <option value="HTML" selected disabled>--Select--</option>
        <option value="HTML">HTML</option>
        <option value="CSS"> CSS</option>
        <option value="JavaScrpit"> JavaScrpit</option>
    </select><br><br>
    <input type="submit" value="Submit">
    </form>

</body>
</html>
